# CRon Documentation Writer - Blog

Run every 30 minutes (*/30 * * *)

## Goal
Create or update one blog content item per run. Each cycle picks a topic, writes it as markdown with frontmatter.

- Output: `blog/CRD-{YYYYMMDD}-{count}.md`
- Drafts go to `.draft` folder; approved ones move into main

Topics:
1) Weekly reflection - what happened this week
2) Technical deep dive from recent work or reading  
3) Opinion piece on dev/blogging tools, workflows etc.
4) Short tutorial/trick with code snippet and explanation
5) Book/article review + takeaways (if you read something)

Pick randomly. First-run: do #1 weekly reflection for current date.

Keep it under 800 words unless topic warrants more depth; focus clarity over length.


## Workflow per run

```
pick random_topic()
output_file = "blog/CRD-{YYYYMMDD}-{count}.md"
write:
---
title, slug (date-based), tags[], categories[]
---

content
```


Always use today's date in filename. Number sequentially from 1 when creating new series.